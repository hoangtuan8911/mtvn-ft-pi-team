    <style>
      html,body,#root{height:100%;margin:0;overflow:hidden}
      .recharts-legend-wrapper{max-height:100%}
      .iss-back,.pj-back{display:none}
      @media (max-width:768px){
        html,body,#root{
          width:100%;
          height:auto!important;
          min-height:100%!important;
          min-height:100dvh!important;
          overflow-x:hidden!important;
          overflow-y:auto!important;
          -webkit-overflow-scrolling:touch
        }
        /* Whole app scrolls — header/tabs can scroll away */
        #root > .app-shell,
        #root > div{
          height:auto!important;
          min-height:100dvh!important;
          overflow:visible!important
        }
        .app-header{
          position:static!important;
          flex-wrap:wrap!important;
          align-items:flex-start!important;
          padding:6px 8px!important;
          gap:6px!important
        }
        .app-header > div:first-child{flex:1 1 100%;min-width:0;order:1}
        .app-header > .app-clock{order:2}
        .app-header > div:last-child{order:3;margin-left:auto}
        .app-title{
          font-size:18px!important;
          line-height:1.2!important
        }
        .app-header > div:first-child > div:nth-child(2){font-size:10px!important}
        .app-header > div:first-child > div:nth-child(3){
          font-size:10px!important;
          padding:2px 6px!important;
          margin-top:2px!important;
          line-height:1.25!important
        }
        .app-clock{
          min-width:118px!important;
          min-height:52px!important;
          padding:6px 8px!important;
          gap:2px!important
        }
        .app-clock > div:first-child{font-size:11px!important}
        .app-clock > div:last-child{font-size:16px!important}
        .app-tabs{
          position:static!important;
          padding-left:8px!important;
          padding-right:8px!important
        }
        /* Content is normal flow, not a tiny trapped scroll pane */
        .app-main{
          flex:none!important;
          overflow:visible!important;
          height:auto!important;
          max-height:none!important;
          min-height:60vh!important;
          padding-bottom:24px!important
        }
        .app-chat-panel{
          height:auto!important;
          min-height:70vh!important;
          max-height:none!important
        }
        [style*="grid-template-columns: 1fr 2fr"]{
          grid-template-columns:minmax(0,1fr)!important;
          gap:10px!important;
          align-items:start!important
        }
        [style*="min-height: 520px"]{min-height:0!important;height:auto!important}
        [style*="grid-template-columns: 1fr 2fr"]>div:nth-child(2),
        .recharts-responsive-container,
        .recharts-wrapper,
        .recharts-legend-wrapper{
          display:none!important
        }
        .iss-wiz,.pj-wiz{
          grid-template-columns:1fr!important;
          height:auto!important;
          min-height:70vh!important
        }
        .iss-wiz>div,.pj-wiz>div{
          max-height:none!important;
          height:auto!important
        }
        .iss-back,.pj-back{display:flex!important;align-items:center}
        .iss-step-cust .iss-col-cases,.iss-step-cust .iss-col-detail,
        .iss-step-cases .iss-col-cust,.iss-step-cases .iss-col-detail,
        .iss-step-detail .iss-col-cust,.iss-step-detail .iss-col-cases,
        .pj-step-list .pj-col-detail,
        .pj-step-detail .pj-col-list{display:none!important}
      }
